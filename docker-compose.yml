# Production compose (devops/06). Secrets live in .env.production on the server only.
name: archibi-web
services:
  archibi_web:
    image: ghcr.io/archibi-ai/frontend:${WEB_TAG:-latest}
    container_name: archibi_web
    env_file: .env.production
    restart: always
    depends_on:
      archibi_web_redis: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]   # host nginx; drop if nginx is a container on the same network
    networks: [web, backend]
    deploy: { resources: { limits: { memory: 768m } } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  archibi_web_redis:
    image: redis:7-alpine
    container_name: archibi_web_redis
    command: ["redis-server", "--requirepass", "${WEB_REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    restart: always                  # lesson from the 2026-10 reboot outage
    volumes: [web_redis:/data]
    networks: [web]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$${WEB_REDIS_PASSWORD}\" ping | grep PONG"], interval: 10s, retries: 5 }
    environment: { WEB_REDIS_PASSWORD: "${WEB_REDIS_PASSWORD}" }

networks:
  web: {}
  backend:
    external: true
    name: uritect-backend_default    # confirm on the server (devops/01)
volumes:
  web_redis: {}
