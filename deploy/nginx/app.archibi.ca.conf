# app.archibi.ca — the web app on its own subdomain. WordPress (archibi.ca) is NOT touched.
# Uses the same Cloudflare origin certificate (covers *.archibi.ca) and the snippet archibi_proxy.conf.
# Needs the zones from archibi.ca.conf (limit_req_zone, upstream archibi_web, ab_web log format, set_real_ip_from):
# install archibi.ca.conf's http-level lines once, or copy them into this file's http context.
limit_req_zone $binary_remote_addr zone=ab_auth_app:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ab_ai_app:10m rate=6r/m;
upstream archibi_web_app { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 443 ssl http2;
  server_name app.archibi.ca;
  ssl_certificate     /etc/ssl/archibi/origin.pem;
  ssl_certificate_key /etc/ssl/archibi/origin.key;
  access_log /var/log/nginx/archibi_app.log;

  set_real_ip_from 173.245.48.0/20; set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;   set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20; set_real_ip_from 188.114.96.0/20; set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17; set_real_ip_from 162.158.0.0/15;  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;   set_real_ip_from 172.64.0.0/13;   set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  location = /.well-known/apple-developer-domain-association.txt { alias /etc/archibi/apple-developer-domain-association.txt; }
  location = / { return 302 /ideabank; }

  location ^~ /bff/auth/  { limit_req zone=ab_auth_app burst=5 nodelay; proxy_pass http://archibi_web_app; include /etc/nginx/snippets/archibi_proxy.conf; }
  location = /bff/ai/jobs { limit_req zone=ab_ai_app burst=3 nodelay; client_max_body_size 16m; proxy_pass http://archibi_web_app; include /etc/nginx/snippets/archibi_proxy.conf; }
  location ^~ /bff/       { client_max_body_size 16m; proxy_pass http://archibi_web_app; include /etc/nginx/snippets/archibi_proxy.conf; }
  location /              { proxy_pass http://archibi_web_app; include /etc/nginx/snippets/archibi_proxy.conf; }
}
server { listen 80; server_name app.archibi.ca; return 301 https://app.archibi.ca$request_uri; }
