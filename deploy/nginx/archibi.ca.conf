# archibi.ca path routing (Archibi-AI/documents devops/03). Installed by the owner; no secrets here.
# Refresh the Cloudflare ranges from https://www.cloudflare.com/ips/ before installing.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=ab_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ab_ai:10m rate=6r/m;
log_format ab_web '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent"';

upstream archibi_web { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 443 ssl http2;
  server_name archibi.ca www.archibi.ca;
  ssl_certificate     /etc/ssl/archibi/origin.pem;
  ssl_certificate_key /etc/ssl/archibi/origin.key;
  access_log /var/log/nginx/archibi_web.log ab_web;

  location = /.well-known/apple-developer-domain-association.txt { alias /etc/archibi/apple-developer-domain-association.txt; }

  location ~ ^/(ideabank|hiring|ai|account|billing|auth|_next|web-static)(/|$) {
    proxy_pass http://archibi_web;
    include /etc/nginx/snippets/archibi_proxy.conf;
  }
  location ^~ /bff/auth/  { limit_req zone=ab_auth burst=5 nodelay; proxy_pass http://archibi_web; include /etc/nginx/snippets/archibi_proxy.conf; }
  location = /bff/ai/jobs { limit_req zone=ab_ai burst=3 nodelay; client_max_body_size 16m; proxy_pass http://archibi_web; include /etc/nginx/snippets/archibi_proxy.conf; }
  location ^~ /bff/       { client_max_body_size 16m; proxy_pass http://archibi_web; include /etc/nginx/snippets/archibi_proxy.conf; }

  # Everything else → WordPress origin (unchanged). Replace WP_ORIGIN (owner item K8).
  location / {
    proxy_pass https://WP_ORIGIN;
    proxy_ssl_server_name on;
    proxy_ssl_name archibi.ca;
    proxy_set_header Host archibi.ca;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    client_max_body_size 64m;
  }
}
server { listen 80; server_name archibi.ca www.archibi.ca; return 301 https://archibi.ca$request_uri; }
